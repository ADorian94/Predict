name: Setup Android
description: Shared pinned Windows Android build prerequisites
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.319'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Android platform and build tools
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
        & $sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
        if ($LASTEXITCODE -ne 0) { throw "Android SDK install failed: $LASTEXITCODE" }
    - name: Install MAUI Android workload
      shell: pwsh
      run: |
        dotnet workload install maui-android
        if ($LASTEXITCODE -ne 0) { throw "MAUI workload install failed: $LASTEXITCODE" }
