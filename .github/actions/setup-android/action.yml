name: Setup Android
description: Shared pinned Windows Android build prerequisites
inputs:
  workflow-directory:
    description: Trusted workflow checkout containing global.json
    default: '.'
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.319
          10.0.403
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Android platform and build tools
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
        & $sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
        if ($LASTEXITCODE -ne 0) { throw "Android SDK install failed: $LASTEXITCODE" }
    - name: Install MAUI Android workload
      working-directory: ${{ inputs.workflow-directory }}
      shell: pwsh
      run: |
        dotnet workload install maui-android
        if ($LASTEXITCODE -ne 0) { throw "MAUI workload install failed: $LASTEXITCODE" }
        dotnet --info
        if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect SDK' }
        dotnet --list-runtimes
        if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect runtimes' }
        dotnet workload --version
        if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect workload set' }
        dotnet workload list
        if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect workloads' }
        $sdkVersion = (dotnet --version).Trim()
        if ($LASTEXITCODE -ne 0 -or $sdkVersion -cne '10.0.403') { throw "Unexpected SDK: $sdkVersion" }
        $workloadVersion = (dotnet workload --version).Trim()
        if ($LASTEXITCODE -ne 0 -or $workloadVersion -cne '10.0.403') { throw "Unexpected workload set: $workloadVersion" }
