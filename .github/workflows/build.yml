name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # On PRs this deliberately runs the current PR merge snapshot's tests.
      # No secrets, persisted Git credentials, privileged trigger or deployment.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.319
            10.0.403
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all executable regressions and Python tests
        run: python tools/ci/run_regressions.py
      - uses: ./.github/actions/setup-android
      - uses: ./.github/actions/build-test-apk
